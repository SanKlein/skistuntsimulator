<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Russo One, Arial Black, sans-serif">
  <style>@import url("https://fonts.googleapis.com/css2?family=Russo+One&amp;display=block");</style>
  <defs>
    <linearGradient id="chrome" x1="0" y1="22" x2="0" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".48" stop-color="#9fd6ff"/>
      <stop offset=".52" stop-color="#2b4fa8"/><stop offset="1" stop-color="#cfe9ff"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9dcff"/>
      <stop offset="0.55" stop-color="#d7efff"/>
      <stop offset="1" stop-color="#f3fbff"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe8f4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="990" cy="130" r="70" fill="#fff7d6"/>

  <!-- mountains -->
  <path d="M0 330 L210 200 L360 300 L520 190 L700 320 L900 210 L1200 330 L1200 330 L0 330 Z" fill="#c4d8ec"/>
  <path d="M0 380 L260 250 L470 360 L720 240 L980 360 L1200 270 L1200 380 Z" fill="#aec7e2"/>

  <!-- snow slope -->
  <path d="M0 470 L1200 360 L1200 630 L0 630 Z" fill="url(#snow)"/>
  <path d="M0 470 L1200 360" stroke="#eaf4fd" stroke-width="6" fill="none"/>

  <!-- brick wall -->
  <g>
    <rect x="900" y="360" width="46" height="150" fill="#b0573f"/>
    <g stroke="rgba(255,255,255,.25)" stroke-width="2">
      <line x1="900" y1="384" x2="946" y2="384"/><line x1="900" y1="408" x2="946" y2="408"/>
      <line x1="900" y1="432" x2="946" y2="432"/><line x1="900" y1="456" x2="946" y2="456"/>
      <line x1="923" y1="360" x2="923" y2="384"/><line x1="900" y1="384" x2="900" y2="408"/>
    </g>
    <ellipse cx="923" cy="360" rx="26" ry="7" fill="#fff"/>
  </g>

  <!-- skier mid-backflip over the wall -->
  <g transform="translate(720 250) rotate(150)" stroke-linecap="round" fill="none">
    <path d="M-46 34 H50" stroke="#ffcf33" stroke-width="9"/>
    <path d="M-8 34 L0 8 M10 34 L2 8" stroke="#2b3a67" stroke-width="9"/>
    <path d="M0 8 L4 -20" stroke="#e8442c" stroke-width="12"/>
    <path d="M2 -6 L24 2" stroke="#e8442c" stroke-width="7"/>
    <circle cx="6" cy="-28" r="9" fill="#ffd9b0" stroke="none"/>
    <path d="M-4 -29 a9 9 0 0 1 18 0 Z" fill="#1f2c47" stroke="none"/>
  </g>

  <!-- arcade logo (same art as the in-game logo, 400x140 design units) -->
  <g transform="translate(36 34) scale(1.62)">
    <g transform="skewX(-12) translate(22 0)">
      <text x="200" y="70" text-anchor="middle" font-size="62" letter-spacing="2" fill="url(#chrome)"
        stroke="#ff2d95" stroke-width="7" stroke-linejoin="round" paint-order="stroke">SKI STUNT</text>
      <rect x="60" y="86" width="280" height="30" fill="#ff2d95"/>
      <text x="200" y="110" text-anchor="middle" font-size="24" letter-spacing="9" fill="#fff">SIMULATOR</text>
    </g>
  </g>

  <!-- tagline + domain -->
  <g font-size="34" letter-spacing="1">
    <text x="95" y="321" fill="#ff2d95">FLIP OVER THE WALL.</text>
    <text x="95" y="365" fill="#ff2d95">FREE IN YOUR BROWSER.</text>
    <text x="92" y="318" fill="#0d0b1e">FLIP OVER THE WALL.</text>
    <text x="92" y="362" fill="#0d0b1e">FREE IN YOUR BROWSER.</text>
  </g>
  <rect x="70" y="520" width="452" height="56" rx="6" fill="#ffd400" stroke="#0d0b1e" stroke-width="4"/>
  <text x="296" y="558" text-anchor="middle" font-size="27" letter-spacing="1" fill="#0d0b1e">SKISTUNTSIMULATOR.COM</text>

  <!-- arcade cabinet frame -->
  <rect x="6" y="6" width="1188" height="618" rx="14" fill="none" stroke="#ff2d95" stroke-width="12"/>
  <rect x="17" y="17" width="1166" height="596" rx="8" fill="none" stroke="#33e1ff" stroke-width="6"/>
</svg>
